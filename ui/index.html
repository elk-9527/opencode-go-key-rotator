<!doctype html>
<html lang="zh-CN" data-theme="system" data-resolved-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Key Router</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-bar">
    <div class="app-title">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="5.5" cy="10" r="3"></circle>
        <path d="M8.5 10h3M11 10l3.7-3.7M11 10l3.7 3.7"></path>
        <rect x="13.8" y="4.8" width="3" height="3" rx=".65" fill="currentColor" stroke="none"></rect>
        <rect x="13.8" y="12.2" width="3" height="3" rx=".65" fill="currentColor" stroke="none"></rect>
      </svg>
      <h1>Key Router</h1>
      <span id="versionText">v0.6.0</span>
    </div>
    <div class="app-actions">
      <button class="toolbar-button" id="detectButton" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 6V2.5m0 0H12m3.5 0-2.7 2.7a6 6 0 1 0 1.5 6"></path></svg>
        重新检测
      </button>
      <div class="theme-control" role="radiogroup" aria-label="界面主题">
        <button type="button" role="radio" aria-checked="false" data-theme-choice="light" title="日间主题" aria-label="日间主题">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3"></circle><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.4 4.4l1.4 1.4M14.2 14.2l1.4 1.4M15.6 4.4l-1.4 1.4M5.8 14.2l-1.4 1.4"></path></svg>
        </button>
        <button type="button" role="radio" aria-checked="false" data-theme-choice="dark" title="夜间主题" aria-label="夜间主题">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.4 12.1A6.7 6.7 0 0 1 7.9 3.6a6.7 6.7 0 1 0 8.5 8.5Z"></path></svg>
        </button>
        <button type="button" role="radio" aria-checked="true" data-theme-choice="system" title="跟随系统" aria-label="跟随系统">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="10.5" rx="1"></rect><path d="M7 17h6M10 14v3"></path></svg>
        </button>
      </div>
      <button class="icon-button" id="quitButton" type="button" title="关闭" aria-label="关闭软件">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"></path></svg>
      </button>
    </div>
  </header>

  <main class="app-shell" id="workspace">
    <aside class="control-pane">
      <section class="connection-section" aria-labelledby="connectionTitle">
        <div class="section-heading">
          <h2 id="connectionTitle">连接参数</h2>
          <span class="inline-status" id="sourceStatus" data-tone="idle">未填写</span>
        </div>
        <form id="connectionForm" novalidate>
          <label for="urlInput">Base URL</label>
          <input id="urlInput" name="base-url" type="url" inputmode="url" placeholder="https://api.example.com/v1" autocomplete="url" spellcheck="false">
          <div class="label-line">
            <label for="keyInput">API Key</label>
            <span id="validationText">未输入</span>
          </div>
          <div class="key-input">
            <input id="keyInput" name="api-key" type="password" placeholder="粘贴 API Key" autocomplete="off" spellcheck="false">
            <button id="revealButton" type="button">显示</button>
          </div>
        </form>
      </section>

      <section class="targets-section" aria-labelledby="targetsTitle">
        <div class="section-heading target-heading">
          <h2 id="targetsTitle">本机工具 <span id="selectedCount">0</span></h2>
          <span id="detectSummary">检测中</span>
        </div>
        <div class="target-list" id="targets" role="list" aria-live="polite">
          <div class="list-placeholder">正在读取本机配置…</div>
        </div>
      </section>
    </aside>

    <section class="work-pane" aria-labelledby="previewTitle">
      <header class="work-toolbar">
        <div>
          <h2 id="previewTitle">配置检查</h2>
          <span id="modeText">选择左侧工具查看详情</span>
        </div>
        <div class="work-actions">
          <button class="button secondary" id="previewButton" type="button" disabled>生成预览</button>
          <button class="button primary" id="applyButton" type="button" disabled>应用更改</button>
        </div>
      </header>

      <section class="inspector" aria-labelledby="inspectorTitle">
        <div class="inspector-heading">
          <h3 id="inspectorTitle">发现详情</h3>
          <span id="inspectorState">—</span>
        </div>
        <div class="inspector-body" id="targetInspector">
          <p class="plain-empty">检测完成后，在左侧选择一个工具。</p>
        </div>
      </section>

      <section class="changes" aria-labelledby="changesTitle">
        <div class="changes-heading">
          <h3 id="changesTitle">待修改文件</h3>
          <span id="changeCount">0</span>
        </div>
        <div class="change-table" id="changeList" hidden></div>
        <div class="changes-empty" id="emptyState">
          <strong>尚未生成预览</strong>
          <span>填写连接参数并选择工具。</span>
        </div>
      </section>

      <details class="run-log" id="logDetails">
        <summary>运行记录 <span id="logCount">0</span></summary>
        <div class="log-window" id="logWindow" role="log" aria-live="polite"></div>
      </details>
    </section>
  </main>

  <footer class="status-bar">
    <span><i></i><b id="footerStatus">本地运行</b></span>
    <span id="backupHint">备份：%LOCALAPPDATA%\Key Router\backups</span>
    <span>只写入已勾选项目</span>
  </footer>

  <dialog id="confirmDialog">
    <form method="dialog" class="dialog-panel">
      <h2>确认应用</h2>
      <p id="confirmText">将先创建备份，再写入所选工具。</p>
      <div class="dialog-actions">
        <button class="button secondary" value="cancel">取消</button>
        <button class="button primary" id="confirmApply" value="default">应用</button>
      </div>
    </form>
  </dialog>

  <dialog id="installDialog" class="install-dialog">
    <form method="dialog" class="dialog-panel install-panel" id="installForm">
      <header class="install-head">
        <span class="install-glyph" aria-hidden="true">
          <svg viewBox="0 0 20 20"><path d="M10 2.5v9m0 0 3.2-3.2M10 11.5 6.8 8.3M4 15.5h12"></path></svg>
        </span>
        <div>
          <span class="official-badge">OFFICIAL</span>
          <h2 id="installTitle">安装工具</h2>
        </div>
      </header>

      <dl class="install-facts">
        <div><dt>来源</dt><dd id="installPublisher">—</dd></div>
        <div><dt>标识</dt><dd id="installIdentity">—</dd></div>
      </dl>

      <div class="install-location">
        <label for="installLocation">安装位置</label>
        <div class="path-bar">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 5.5h5l1.5 2h8.5v8.5h-15z"></path></svg>
          <input id="installLocation" type="text" readonly>
          <button id="chooseInstallLocation" type="button">更改</button>
        </div>
        <span id="installPathHint">—</span>
      </div>

      <p class="install-note" id="installNote">—</p>

      <div class="install-progress" id="installProgress" hidden aria-live="polite">
        <div class="install-progress-line"><i></i></div>
        <span id="installProgressText">正在下载安装包…</span>
      </div>

      <div class="dialog-actions">
        <button class="button secondary" id="cancelInstall" value="cancel">取消</button>
        <button class="button primary install-confirm" id="confirmInstall" type="button">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m0 0 3-3m-3 3L7 9M4 16h12"></path></svg>
          安装
        </button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
