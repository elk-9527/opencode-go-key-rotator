name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python web_app.py --smoke-test
      - run: node --check ui/app.js
      - run: ruff check rotate_keys.py web_app.py agent_installers.py tests
      - run: bandit -c pyproject.toml -r rotate_keys.py web_app.py agent_installers.py
      - run: pip-audit --requirement requirements-dev.txt --strict
      - run: pyinstaller key-rotator.spec --clean --noconfirm
      - run: python tests/package_e2e.py dist/Key-Router.exe
